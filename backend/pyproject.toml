[project]
name = "localvideo-control-plane"
version = "0.1.0"
description = "Control Plane do LocalVideo AI: orquestração de GPU sob demanda (Vast.ai), custo, armazenamento persistente e geração de vídeo."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Depends() em defaults é o padrão oficial do FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

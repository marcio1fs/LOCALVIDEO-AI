services:
  # ------ CRM de atendimento (frontend + API local) ------
  crm:
    build: .
    container_name: crm-atendimento
    ports:
      - "4000:4000"
    environment:
      - CRM_PORT=4000
      - CRM_HOST=0.0.0.0
      # Notificacoes por e-mail (preencha no .env)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@empresa.com}
      # Integracao com a instancia n8n (webhooks)
      - N8N_BASE_URL=${N8N_BASE_URL:-https://mastercrm.app.n8n.cloud}
      - N8N_API_KEY=${N8N_API_KEY:-}
    restart: unless-stopped

  # ------ n8n (automacoes) ------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.localhost
      - N8N_PORT=5678
      - WEBHOOK_BASE_PATH=/webhook
      - DB_TYPE=postgresdb
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENCRYPTION_KEY=change-this-to-a-long-random-secret
      - N8N_SECURE_COOKIE=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - db
    restart: unless-stopped

  # ------ Banco do n8n (Postgres) ------
  db:
    image: postgres:16-alpine
    container_name: n8n-db
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  n8n_data:
  pg_data:
